      <path d="M0,-14 C2.5,-14 4.5,-11 4.5,-6 C4.5,-3 2,-1 0,0 C-2,-1 -4.5,-3 -4.5,-6 C-4.5,-11 -2.5,-14 0,-14 Z" transform="rotate(120)"/>
