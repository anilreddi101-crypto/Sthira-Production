<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="100%" height="100%">
  <!-- Saint-Gobain colorful bridge emblem -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue/Cyan wave -->
    <path d="M52,32 C62,32 68,26 76,27 C84,28 88,32 94,32 C97,32 100,28 103,28" stroke="#0072CE"/>
    <!-- Yellow/Orange middle wave -->
    <path d="M103,28 C108,28 112,18 117,17 C122,16 126,24 130,24" stroke="#F39200"/>
    <!-- Red/Pink bridge peak -->
    <path d="M118,17 C120,13 124,11 127,11 C130,11 133,15 135,19 L137,28 C140,30 148,31 168,32" stroke="#E2001A"/>
    <!-- Vertical building struts -->
    <line x1="123" y1="12" x2="123" y2="32" stroke="#E2001A" stroke-width="1.8"/>
    <line x1="127" y1="11" x2="127" y2="32" stroke="#E2001A" stroke-width="1.8"/>
    <line x1="131" y1="13" x2="131" y2="32" stroke="#E2001A" stroke-width="1.8"/>
    <line x1="117" y1="17" x2="117" y2="32" stroke="#F39200" stroke-width="1.8"/>
    <line x1="112" y1="21" x2="112" y2="32" stroke="#00A3E0" stroke-width="1.8"/>
    <line x1="107" y1="26" x2="107" y2="32" stroke="#0072CE" stroke-width="1.8"/>
    <line x1="88" y1="30" x2="88" y2="32" stroke="#0072CE" stroke-width="1.8"/>
    <line x1="76" y1="27" x2="76" y2="32" stroke="#0072CE" stroke-width="1.8"/>
  </g>
  <!-- SAINT-GOBAIN Text -->
  <text x="110" y="47" font-family="'Poppins', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#005596" text-anchor="middle" letter-spacing="1.5">SAINT-GOBAIN</text>
</svg>
